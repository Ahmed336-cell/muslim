name: Privacy policy page

on:
  push:
    branches: [main]
    paths:
      - store/play/privacy_policy.html
      - .github/workflows/privacy-policy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacy/
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site/privacy
          cp store/play/privacy_policy.html _site/privacy/index.html
          cp store/play/privacy_policy.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
